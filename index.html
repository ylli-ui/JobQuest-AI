<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Interview - Hong Kong Primary 5</title>
  <!-- Google Fonts for cute, readable typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       CSS STYLES & THEME (Cute Pink Pastel Design)
       ========================================================================== */
    :root {
      --bg-pink: #FFF0F5;
      --light-pink: #FFD6E8;
      --hot-pink: #FF69B4;
      --dark-pink: #D81B60;
      --lavender: #E6E6FA;
      --light-blue: #DFF6FF;
      --soft-yellow: #FFF9D2;
      --mint-green: #E8FAEE;
      --white: #FFFFFF;
      --text-dark: #2D3748;
      --text-muted: #718096;
      --border-pink: #FFB6C1;
      --shadow-soft: 0 10px 25px rgba(255, 105, 180, 0.15);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-pink);
      background-image: radial-gradient(#FFD6E8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Header & Key Setup Bar */
    .app-header {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(135deg, var(--hot-pink), #FF8DA1);
      color: var(--white);
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .app-header h1 {
      font-family: 'Fredoka', cursive;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .api-key-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: var(--radius-md);
    }

    .api-key-container label {
      font-size: 0.85rem;
      font-weight: 700;
    }

    .api-key-container input {
      padding: 6px 12px;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 0.85rem;
      width: 180px;
      transition: all 0.2s;
    }

    .api-key-container input:focus {
      border-color: var(--dark-pink);
      background: var(--white);
    }

    /* Main Layout Grid */
    .app-layout {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Left & Right Panels */
    .panel {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      border: 3px solid var(--light-pink);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.25rem;
      color: var(--dark-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 2px dashed var(--light-pink);
      padding-bottom: 8px;
    }

    /* Step 1: Student Setup */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 700;
      color: var(--dark-pink);
      font-size: 0.95rem;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--light-pink);
      border-radius: var(--radius-md);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: var(--bg-pink);
    }

    .input-field:focus {
      border-color: var(--hot-pink);
      box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.2);
      background-color: var(--white);
    }

    /* Step 2: Career Selection Grid */
    .career-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .career-grid::-webkit-scrollbar {
      width: 6px;
    }

    .career-grid::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .career-card {
      background: var(--white);
      border: 2px solid var(--light-pink);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .career-card:hover {
      transform: translateY(-3px);
      border-color: var(--hot-pink);
      background-color: var(--bg-pink);
    }

    .career-card.active {
      background-color: var(--light-pink);
      border-color: var(--hot-pink);
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
      transform: scale(1.03);
    }

    .career-card .emoji {
      font-size: 1.8rem;
    }

    .career-card .title {
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-dark);
    }

    /* Avatar & Status Card */
    .avatar-card {
      background: linear-gradient(180deg, var(--light-pink) 0%, var(--lavender) 100%);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--white);
      border: 4px solid var(--white);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .career-badge {
      margin-top: 10px;
      background: var(--hot-pink);
      color: var(--white);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .status-indicator {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #CBD5E0;
    }

    .status-indicator.ready .status-dot { background-color: #48BB78; }
    .status-indicator.listening .status-dot { background-color: #E53E3E; animation: pulse 1s infinite; }
    .status-indicator.processing .status-dot { background-color: #ED8936; animation: pulse 1s infinite; }
    .status-indicator.speaking .status-dot { background-color: var(--hot-pink); animation: pulse 0.6s infinite; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Teacher Controls & Suggested Questions Panel */
    .teacher-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--hot-pink);
      width: 16px;
      height: 16px;
    }

    .suggested-questions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggested-questions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .suggested-questions-grid::-webkit-scrollbar {
      width: 6px;
    }

    .suggested-questions-grid::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .question-btn {
      background-color: var(--light-blue);
      border: 1.5px solid #BEE3F8;
      color: #2B6CB0;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .question-btn:hover {
      background-color: #BEE3F8;
      border-color: #63B3ED;
      transform: translateX(3px);
    }

    .idea-btn {
      background: linear-gradient(135deg, #F6AD55, #ED8936);
      color: var(--white);
      border: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
      min-height: 44px;
    }

    .idea-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(237, 137, 54, 0.3);
    }

    /* Right Panel: Chat Area */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 650px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-pink);
      border-radius: var(--radius-md);
      border: 2px solid var(--light-pink);
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.45;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-bubble.user {
      align-self: flex-end;
      background-color: var(--hot-pink);
      color: var(--white);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.25);
    }

    .message-bubble.ai {
      align-self: flex-start;
      background-color: var(--white);
      color: var(--text-dark);
      border: 2px solid var(--light-pink);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message-header {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .message-timestamp {
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.7;
    }

    /* Chat Input Form Controls */
    .chat-input-area {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mic-btn {
      background-color: var(--lavender);
      border: 2px solid #C6F6D5;
      color: #2F855A;
      background: #F0FFF4;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mic-btn:hover {
      background-color: #DCFCE7;
      transform: scale(1.05);
    }

    .mic-btn.listening {
      background-color: #FED7D7;
      border-color: #FEB2B2;
      color: #C53030;
      animation: pulse 1s infinite;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--hot-pink), var(--dark-pink));
      color: var(--white);
      border: none;
      padding: 0 20px;
      height: 48px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading Spinner */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px solid var(--light-pink);
      align-self: flex-start;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--hot-pink);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* ==========================================================================
       RESPONSIVE DESIGN (Tablets & Mobile Devices)
       ========================================================================== */
    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .chat-container {
        height: 500px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .app-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 18px;
      }

      .app-header h1 {
        font-size: 1.4rem;
      }

      .api-key-container {
        width: 100%;
        justify-content: space-between;
      }

      .api-key-container input {
        width: 140px;
      }

      .panel {
        padding: 14px;
        border-radius: var(--radius-md);
      }

      .career-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        max-height: 180px;
      }

      .career-card .emoji {
        font-size: 1.5rem;
      }

      .career-card .title {
        font-size: 0.75rem;
      }

      .chat-container {
        height: 420px;
      }

      .message-bubble {
        max-width: 90%;
        font-size: 0.88rem;
      }

      .send-btn {
        padding: 0 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <h1><span>🌟</span> AI Career Interview <span>👩‍🏫</span></h1>
    <div class="api-key-container">
      <label for="apiKeyInput">Gemini Key:</label>
      <input type="password" id="apiKeyInput" placeholder="Paste API Key here..." aria-label="Gemini API Key Input">
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-layout">
    
    <!-- LEFT PANEL: Setup, Avatar, Teacher Controls & Suggestions -->
    <section class="panel" aria-label="Student Configuration Panel">
      
      <!-- Step 1: Student Setup -->
      <div class="form-group">
        <div class="section-title">
          <span>Step 1: Your Info</span>
          <span>✏️</span>
        </div>
        <label for="studentNameInput">Your Name</label>
        <input type="text" id="studentNameInput" class="input-field" placeholder="Enter your name" value="Alex" aria-label="Student Name Input">
      </div>

      <!-- Step 2: Select Career -->
      <div class="form-group">
        <div class="section-title">
          <span>Step 2: Choose Career</span>
          <span>💼</span>
        </div>
        <div class="career-grid" id="careerGrid" role="radiogroup" aria-label="Career Selection">
          <!-- Dynamically populated career cards -->
        </div>
      </div>

      <!-- Avatar & AI Status -->
      <div class="avatar-card" aria-label="AI Interviewer Avatar">
        <div class="avatar-wrapper">
          <img id="avatarImg" class="avatar-img" src="" alt="AI Roleplay Avatar">
        </div>
        <div id="careerBadge" class="career-badge">Teacher 👩‍🏫</div>
        <div id="statusIndicator" class="status-indicator ready" aria-live="polite">
          <span class="status-dot"></span>
          <span id="statusText">AI Status: Ready</span>
        </div>
      </div>

      <!-- Teacher Controls & Suggested Questions Panel -->
      <div class="form-group">
        <div class="teacher-control">
          <label class="checkbox-label">
            <input type="checkbox" id="toggleSuggestions" checked aria-label="Toggle Suggested Questions">
            Show Suggested Questions
          </label>
        </div>

        <div id="suggestedQuestionsContainer" class="suggested-questions-container">
          <button id="ideaBtn" class="idea-btn" type="button">
            <span>💡</span> Give Me a Question Idea
          </button>
          
          <div class="section-title" style="font-size: 1rem; border: none; padding: 0; margin-top: 4px;">
            <span>Suggested Questions</span>
          </div>
          
          <div id="suggestedQuestionsGrid" class="suggested-questions-grid">
            <!-- Dynamically populated suggested question buttons -->
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: Interactive Chat & Speech Area -->
    <section class="panel chat-container" aria-label="Chat and Interaction Area">
      <div class="section-title">
        <span>Interview Chat</span>
        <span>💬</span>
      </div>

      <!-- Chat History -->
      <div id="chatMessages" class="chat-messages" aria-live="polite">
        <!-- Chat bubbles appended here dynamically -->
      </div>

      <!-- Input Controls -->
      <div class="chat-input-area">
        <div class="input-controls-row">
          <button id="micBtn" class="mic-btn" type="button" title="Tap to Speak" aria-label="Speech Recognition Button">
            🎙️
          </button>
          <input type="text" id="questionInput" class="input-field" placeholder="Type your question..." aria-label="Question Input Textbox">
          <button id="sendBtn" class="send-btn" type="button" aria-label="Send Question Button">
            <span>Send</span> 🚀
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript Code Section -->
  <script>
    /* ==========================================================================
       1. CONFIG
       ========================================================================== */
    // Default API Key constant. Teachers can paste here directly OR use the top-right header input box.
    const GEMINI_API_KEY = "PASTE_YOUR_API_KEY_HERE";

    // Embedded SVG Data URIs for cute default avatars (Closed & Open Mouth)
    const CLOSED_MOUTH_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' rx='40' fill='%23FFD6E8'/><circle cx='100' cy='100' r='70' fill='%23FFFFFF' stroke='%23FF69B4' stroke-width='6'/><circle cx='75' cy='90' r='10' fill='%23333333'/><circle cx='125' cy='90' r='10' fill='%23333333'/><circle cx='78' cy='87' r='3' fill='%23FFFFFF'/><circle cx='128' cy='87' r='3' fill='%23FFFFFF'/><ellipse cx='60' cy='115' rx='10' ry='6' fill='%23FFB6C1' opacity='0.7'/><ellipse cx='140' cy='115' rx='10' ry='6' fill='%23FFB6C1' opacity='0.7'/><path d='M 85 118 Q 100 130 115 118' fill='none' stroke='%23FF69B4' stroke-width='5' stroke-linecap='round'/><polygon points='100,30 110,50 90,50' fill='%23FFD166'/></svg>";

    const OPEN_MOUTH_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' rx='40' fill='%23FFD6E8'/><circle cx='100' cy='100' r='70' fill='%23FFFFFF' stroke='%23FF69B4' stroke-width='6'/><circle cx='75' cy='90' r='10' fill='%23333333'/><circle cx='125' cy='90' r='10' fill='%23333333'/><circle cx='78' cy='87' r='3' fill='%23FFFFFF'/><circle cx='128' cy='87' r='3' fill='%23FFFFFF'/><ellipse cx='60' cy='115' rx='10' ry='6' fill='%23FFB6C1' opacity='0.7'/><ellipse cx='140' cy='115' rx='10' ry='6' fill='%23FFB6C1' opacity='0.7'/><path d='M 85 112 Q 100 135 115 112 Z' fill='%23FF69B4' stroke='%23D81B60' stroke-width='3'/><polygon points='100,30 110,50 90,50' fill='%23FFD166'/></svg>";


    /* ==========================================================================
       2. CAREER DATA
       ========================================================================== */
    const CAREERS = [
      { id: "teacher", title: "Teacher", emoji: "👩‍🏫" },
      { id: "chef", title: "Chef", emoji: "👨‍🍳" },
      { id: "singer", title: "Singer", emoji: "🎤" },
      { id: "actor", title: "Actor", emoji: "🎬" },
      { id: "doctor", title: "Doctor", emoji: "👨‍⚕️" },
      { id: "vet", title: "Vet", emoji: "🐶" },
      { id: "scientist", title: "Scientist", emoji: "🔬" },
      { id: "fashion_designer", title: "Fashion Designer", emoji: "👗" },
      { id: "nurse", title: "Nurse", emoji: "👩‍⚕️" },
      { id: "firefighter", title: "Firefighter", emoji: "🚒" },
      { id: "astronaut", title: "Astronaut", emoji: "🚀" },
      { id: "pilot", title: "Pilot", emoji: "✈️" },
      { id: "youtuber", title: "YouTuber", emoji: "📹" }
    ];


    /* ==========================================================================
       3. SUGGESTED QUESTIONS DATA
       ========================================================================== */
    const UNIVERSAL_QUESTIONS = [
      "What do you do every day?",
      "Why did you choose this job?",
      "What do you like most about your job?",
      "Is your job difficult?",
      "What skills do you need?",
      "How can I become like you?",
      "What is the most exciting part of your job?",
      "Can you tell me a fun story from your work?"
    ];

    const CAREER_QUESTIONS = {
      teacher: [
        "Why do you like teaching children?",
        "What subjects do you teach?",
        "How do you help students learn?",
        "What makes a good teacher?"
      ],
      chef: [
        "What is your favourite dish to cook?",
        "How do you create new recipes?",
        "Is it difficult to work in a kitchen?",
        "What skills does a chef need?"
      ],
      singer: [
        "How often do you practise singing?",
        "What is your favourite song to perform?",
        "Were you nervous on stage at first?",
        "How can I improve my singing?"
      ],
      actor: [
        "How do you remember your lines?",
        "What is it like to be in a movie?",
        "Have you played a funny character?",
        "What skills does an actor need?"
      ],
      doctor: [
        "How do you help sick people?",
        "What subjects should I study to become a doctor?",
        "What is the hardest part of your job?",
        "Why did you become a doctor?"
      ],
      vet: [
        "What animals do you help most often?",
        "How do you care for sick pets?",
        "Have you ever helped a very unusual animal?",
        "Why do animals need vets?"
      ],
      scientist: [
        "What kinds of things do you study?",
        "Have you made an exciting discovery?",
        "Why is science important?",
        "What science experiments do you enjoy?"
      ],
      fashion_designer: [
        "How do you design new clothes?",
        "Where do you get your ideas?",
        "What colours are popular now?",
        "What skills does a fashion designer need?"
      ],
      nurse: [
        "How do you care for patients?",
        "What is a typical day like?",
        "What makes a good nurse?",
        "Why did you choose this job?"
      ],
      firefighter: [
        "How do you stay brave during emergencies?",
        "What equipment do firefighters use?",
        "Have you rescued anyone before?",
        "Why is teamwork important in your job?"
      ],
      astronaut: [
        "What is it like in space?",
        "How do you eat in space?",
        "What training do astronauts need?",
        "Have you seen Earth from space?"
      ],
      pilot: [
        "How do you fly an airplane?",
        "What do pilots do before a flight?",
        "How long did it take to become a pilot?",
        "What is your favourite place to fly to?"
      ],
      youtuber: [
        "How do you make videos?",
        "What equipment do you use?",
        "How do you get new video ideas?",
        "What advice do you have for young creators?"
      ]
    };


    /* ==========================================================================
       4. UI ELEMENTS & APP STATE
       ========================================================================== */
    const apiKeyInput = document.getElementById("apiKeyInput");
    const studentNameInput = document.getElementById("studentNameInput");
    const careerGrid = document.getElementById("careerGrid");
    const avatarImg = document.getElementById("avatarImg");
    const careerBadge = document.getElementById("careerBadge");
    const statusIndicator = document.getElementById("statusIndicator");
    const statusText = document.getElementById("statusText");
    const toggleSuggestions = document.getElementById("toggleSuggestions");
    const suggestedQuestionsContainer = document.getElementById("suggestedQuestionsContainer");
    const suggestedQuestionsGrid = document.getElementById("suggestedQuestionsGrid");
    const ideaBtn = document.getElementById("ideaBtn");
    const chatMessages = document.getElementById("chatMessages");
    const questionInput = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    let currentCareer = CAREERS[0]; // Default: Teacher
    let conversationHistory = []; // Session chat history
    let mouthInterval = null; // Avatar animation interval
    let recognition = null; // Speech recognition instance
    let isListening = false;


    /* ==========================================================================
       5. AVATAR FUNCTIONS
       ========================================================================== */
    function initAvatar() {
      avatarImg.src = CLOSED_MOUTH_IMG;
    }

    function startTalkingAnimation() {
      stopTalkingAnimation(); // Ensure no duplicate intervals
      let isOpen = false;
      avatarImg.src = OPEN_MOUTH_IMG;
      isOpen = true;

      mouthInterval = setInterval(() => {
        isOpen = !isOpen;
        avatarImg.src = isOpen ? OPEN_MOUTH_IMG : CLOSED_MOUTH_IMG;
      }, 180);
    }

    function stopTalkingAnimation() {
      if (mouthInterval) {
        clearInterval(mouthInterval);
        mouthInterval = null;
      }
      avatarImg.src = CLOSED_MOUTH_IMG;
    }

    function updateStatus(stateMessage, stateClass) {
      statusText.textContent = `AI Status: ${stateMessage}`;
      statusIndicator.className = `status-indicator ${stateClass}`;
    }


    /* ==========================================================================
       6. SPEECH RECOGNITION (STT)
       ========================================================================== */
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        console.warn("Speech Recognition API is not supported in this browser.");
        micBtn.style.opacity = "0.5";
        micBtn.title = "Speech recognition not supported in this browser";
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      // Primary English fallback order
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        updateStatus("Listening...", "listening");
        micBtn.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        questionInput.value = transcript;
        updateStatus("Processing...", "processing");
      };

      recognition.onerror = (event) => {
        console.error("Speech Recognition Error:", event.error);
        isListening = false;
        micBtn.classList.remove("listening");
        updateStatus("Ready", "ready");
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove("listening");
        if (statusText.textContent.includes("Listening")) {
          updateStatus("Ready", "ready");
        }
      };
    }

    function toggleListening() {
      if (!recognition) {
        alert("Speech recognition is not supported on your browser. Please type your question.");
        return;
      }

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error("Recognition start error:", e);
        }
      }
    }


    /* ==========================================================================
       7. TEXT TO SPEECH (TTS)
       ========================================================================== */
    function speakText(text, onComplete) {
      if (!('speechSynthesis' in window)) {
        if (onComplete) onComplete();
        return;
      }

      // Cancel previous speech
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      
      // Select best available English voice
      const voices = window.speechSynthesis.getVoices();
      const englishVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB') || v.lang.startsWith('en'));
      if (englishVoice) {
        utterance.voice = englishVoice;
      }

      utterance.lang = 'en-US';
      utterance.rate = 0.95; // Friendly cadence for Primary 5 ESL learners
      utterance.pitch = 1.05;

      utterance.onstart = () => {
        updateStatus("Speaking...", "speaking");
        startTalkingAnimation();
      };

      utterance.onend = () => {
        stopTalkingAnimation();
        updateStatus("Finished Speaking", "ready");
        setTimeout(() => updateStatus("Ready", "ready"), 1500);
        if (onComplete) onComplete();
      };

      utterance.onerror = () => {
        stopTalkingAnimation();
        updateStatus("Ready", "ready");
        if (onComplete) onComplete();
      };

      window.speechSynthesis.speak(utterance);
    }


    /* ==========================================================================
       8. GEMINI API INTEGRATION
       ========================================================================== */
    async function callGeminiAPI(userQuestion, career, studentName) {
      // Determine active API Key
      const keyFromInput = apiKeyInput.value.trim();
      const apiKey = keyFromInput || (GEMINI_API_KEY !== "PASTE_YOUR_API_KEY_HERE" ? GEMINI_API_KEY : "");

      if (!apiKey) {
        throw new Error("Please paste your Gemini API Key in the top box to chat!");
      }

      // Primary 5 ESL Prompt Persona Definition
      const systemInstruction = `You are a professional ${career.title}.
You are being interviewed by Primary 5 students in Hong Kong aged 10–11.
Rules:
1. Be cheerful, warm, and encouraging.
2. Use simple English suitable for ESL/EFL learners.
3. Keep answers short.
4. Maximum 2–3 short sentences.
5. Give realistic examples from your work.
6. Encourage curiosity and learning.
7. Avoid difficult vocabulary.
8. Speak directly to children.
9. If asked about dangerous activities, explain safely and appropriately for children.`;

      // Structure conversation history for Gemini API payload
      const contents = conversationHistory.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'model',
        parts: [{ text: msg.content }]
      }));

      // Append new question
      contents.push({
        role: 'user',
        parts: [{ text: userQuestion }]
      });

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: systemInstruction }]
          },
          contents: contents,
          generationConfig: {
            temperature: 0.7,
            maxOutputTokens: 250
          }
        })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        const message = errorData.error?.message || `HTTP error ${response.status}`;
        throw new Error(message);
      }

      const data = await response.json();
      const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!replyText) {
        throw new Error("No response generated from AI.");
      }

      return replyText.trim();
    }


    /* ==========================================================================
       9. CHAT FUNCTIONS
       ========================================================================== */
    function appendMessage(sender, text, role) {
      const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const bubble = document.createElement("div");
      bubble.className = `message-bubble ${role}`;

      const header = document.createElement("div");
      header.className = "message-header";
      header.innerHTML = `<span>${sender}</span><span class="message-timestamp">${timeString}</span>`;

      const body = document.createElement("div");
      body.textContent = text;

      bubble.appendChild(header);
      bubble.appendChild(body);
      chatMessages.appendChild(bubble);

      // Auto-scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTypingIndicator() {
      const indicator = document.createElement("div");
      indicator.id = "typingIndicator";
      indicator.className = "typing-indicator";
      indicator.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;
      chatMessages.appendChild(indicator);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById("typingIndicator");
      if (indicator) {
        indicator.remove();
      }
    }

    async function handleSendQuestion() {
      const question = questionInput.value.trim();
      if (!question) return;

      const studentName = studentNameInput.value.trim() || "Student";

      // Display user message
      appendMessage(studentName, question, "user");
      conversationHistory.push({ role: "user", content: question });

      // Clear input
      questionInput.value = "";
      sendBtn.disabled = true;

      // Update AI Status
      updateStatus("Processing...", "processing");
      showTypingIndicator();

      try {
        const aiResponse = await callGeminiAPI(question, currentCareer, studentName);
        removeTypingIndicator();

        // Display AI message
        appendMessage(`${currentCareer.emoji} ${currentCareer.title}`, aiResponse, "ai");
        conversationHistory.push({ role: "model", content: aiResponse });

        // Speak AI answer aloud with avatar animation
        speakText(aiResponse, () => {
          sendBtn.disabled = false;
        });

      } catch (error) {
        removeTypingIndicator();
        console.error("API Error:", error);
        
        const errorMsg = `Oops! ${error.message}`;
        appendMessage("System 💡", errorMsg, "ai");
        updateStatus("Ready", "ready");
        sendBtn.disabled = false;
      }
    }


    /* ==========================================================================
       10. EVENT HANDLERS & RENDERERS
       ========================================================================== */
    function renderCareers() {
      careerGrid.innerHTML = "";
      CAREERS.forEach((career) => {
        const card = document.createElement("div");
        card.className = `career-card ${career.id === currentCareer.id ? 'active' : ''}`;
        card.setAttribute("role", "radio");
        card.setAttribute("aria-checked", career.id === currentCareer.id);
        card.tabIndex = 0;

        card.innerHTML = `
          <span class="emoji">${career.emoji}</span>
          <span class="title">${career.title}</span>
        `;

        const selectCareer = () => {
          currentCareer = career;
          document.querySelectorAll(".career-card").forEach(c => {
            c.classList.remove("active");
            c.setAttribute("aria-checked", "false");
          });
          card.classList.add("active");
          card.setAttribute("aria-checked", "true");
          
          // Reset conversation history for new career
          conversationHistory = [];
          chatMessages.innerHTML = "";

          // Update UI
          careerBadge.textContent = `${career.title} ${career.emoji}`;
          renderSuggestedQuestions();

          // Initial greeting
          const greeting = `Hello ${studentNameInput.value.trim() || 'there'}! I am a professional ${career.title} ${career.emoji}. What would you like to ask me today?`;
          appendMessage(`${career.emoji} ${career.title}`, greeting, "ai");
          speakText(greeting);
        };

        card.addEventListener("click", selectCareer);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectCareer();
          }
        });

        careerGrid.appendChild(card);
      });
    }

    function renderSuggestedQuestions() {
      suggestedQuestionsGrid.innerHTML = "";
      
      // Combine career-specific and universal questions
      const careerSpecific = CAREER_QUESTIONS[currentCareer.id] || [];
      const combinedQuestions = [...careerSpecific, ...UNIVERSAL_QUESTIONS].slice(0, 8);

      combinedQuestions.forEach((questionText) => {
        const qBtn = document.createElement("button");
        qBtn.className = "question-btn";
        qBtn.type = "button";
        qBtn.textContent = questionText;

        qBtn.addEventListener("click", () => {
          questionInput.value = questionText;
          questionInput.focus();
        });

        suggestedQuestionsGrid.appendChild(qBtn);
      });
    }

    function handleRandomIdea() {
      const careerSpecific = CAREER_QUESTIONS[currentCareer.id] || [];
      const combinedQuestions = [...careerSpecific, ...UNIVERSAL_QUESTIONS];
      const randomIndex = Math.floor(Math.random() * combinedQuestions.length);
      questionInput.value = combinedQuestions[randomIndex];
      questionInput.focus();
    }

    // Initialize Application
    window.addEventListener("DOMContentLoaded", () => {
      initAvatar();
      renderCareers();
      renderSuggestedQuestions();
      setupSpeechRecognition();

      // Check saved key in localStorage
      const savedKey = localStorage.getItem("user_gemini_api_key");
      if (savedKey) {
        apiKeyInput.value = savedKey;
      }

      // Save API key on change
      apiKeyInput.addEventListener("input", () => {
        localStorage.setItem("user_gemini_api_key", apiKeyInput.value.trim());
      });

      // Toggle suggested questions panel
      toggleSuggestions.addEventListener("change", (e) => {
        suggestedQuestionsContainer.style.display = e.target.checked ? "flex" : "none";
      });

      // Random question generator button
      ideaBtn.addEventListener("click", handleRandomIdea);

      // Send message handlers
      sendBtn.addEventListener("click", handleSendQuestion);
      questionInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSendQuestion();
        }
      });

      // Mic button handler
      micBtn.addEventListener("click", toggleListening);

      // Initial Welcome Message
      const initialGreeting = `Hello Alex! I am a professional Teacher 👩‍🏫. What would you like to ask me today?`;
      appendMessage("👩‍🏫 Teacher", initialGreeting, "ai");
    });
  </script>
