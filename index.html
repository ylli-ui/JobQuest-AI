<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 AI Career Interview 🌸</title>
  <!-- Google Fonts: Fredoka & Nunito for a playful, kid-friendly look -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================================================
       PINK & CUTE THEME COLOR PALETTE & STYLES
       ========================================================================= */
    :root {
      --pink-primary: #FF6B9D;
      --pink-hover: #FF4785;
      --pink-soft: #FFE4EC;
      --pink-card-bg: #FFF5F8;
      --pink-light-bg: #FFF0F5;
      --accent-yellow: #FFD166;
      --accent-purple: #C77DFF;
      --text-main: #4A3E4E;
      --text-muted: #8C7A92;
      --border-radius: 24px;
      --shadow-cute: 0 10px 25px rgba(255, 107, 157, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--pink-light-bg);
      background-image: 
        radial-gradient(#FFD1DC 1.5px, transparent 1.5px), 
        radial-gradient(#FFD1DC 1.5px, #FFF0F5 1.5px);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Cute Header --- */
    header {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 1rem 2rem;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-family: 'Fredoka', sans-serif;
      color: var(--pink-primary);
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* --- Layout Container --- */
    .container {
      width: 100%;
      max-width: 950px;
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card {
      background: white;
      border-radius: var(--border-radius);
      padding: 2rem;
      box-shadow: var(--shadow-cute);
      border: 3px solid #FFF0F5;
      margin-bottom: 1.5rem;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none !important;
    }

    /* --- Titles & Text --- */
    .step-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 2rem;
      color: var(--pink-primary);
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .step-desc {
      color: var(--text-muted);
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 1.8rem;
      font-weight: 600;
    }

    /* --- Input & Buttons --- */
    .input-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      max-width: 500px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 240px;
      padding: 0.9rem 1.4rem;
      border: 3px solid #FFD1DC;
      border-radius: 30px;
      font-size: 1.1rem;
      outline: none;
      transition: all 0.2s;
      background: var(--pink-card-bg);
      color: var(--text-main);
      font-weight: 700;
    }

    input[type="text"]:focus {
      border-color: var(--pink-primary);
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.2);
      background: white;
    }

    .btn {
      background-color: var(--pink-primary);
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 30px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 15px rgba(255, 107, 157, 0.3);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn:hover {
      background-color: var(--pink-hover);
      transform: translateY(-2px) scale(1.02);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-secondary {
      background-color: #FFE4EC;
      color: var(--pink-primary);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: #FFD1DC;
    }

    /* --- STEP 2: Job Selection Grid (11 Jobs) --- */
    .jobs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1.2rem;
      margin-top: 1rem;
    }

    @media (min-width: 600px) {
      .jobs-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }

    .job-card {
      background: var(--pink-card-bg);
      border: 3px solid #FFE4EC;
      border-radius: 20px;
      padding: 1rem 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .job-card:hover {
      border-color: var(--pink-primary);
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.25);
      background: white;
    }

    .job-card.selected {
      border-color: var(--pink-primary);
      background: #FFE4EC;
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.3);
    }

    .job-card img {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      margin-bottom: 0.6rem;
      border: 3px solid white;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .job-card h3 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: var(--text-main);
    }

    /* --- STEP 3: Chatroom Layout --- */
    .chat-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .chat-layout {
        grid-template-columns: 1fr;
      }
    }

    .avatar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--pink-card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      border: 3px solid #FFE4EC;
    }

    .avatar-wrapper {
      position: relative;
      width: 170px;
      height: 170px;
      margin-bottom: 1rem;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 5px solid var(--pink-primary);
      background: white;
      box-shadow: 0 8px 20px rgba(255, 107, 157, 0.25);
      transition: transform 0.1s ease;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      background: #E5E7EB;
      color: var(--text-muted);
    }

    .status-badge.speaking {
      background: #D1FAE5;
      color: #059669;
      animation: pulseBadge 1s infinite alternate;
    }

    .status-badge.listening {
      background: #FEF3C7;
      color: #D97706;
      animation: pulseBadge 0.8s infinite alternate;
    }

    @keyframes pulseBadge {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    /* --- Chat Messages --- */
    .chat-panel {
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border: 3px solid #FFE4EC;
      border-radius: 20px;
      margin-bottom: 1rem;
      background: #FFFDFE;
    }

    .message {
      max-width: 82%;
      padding: 0.9rem 1.2rem;
      border-radius: 22px;
      font-size: 1rem;
      line-height: 1.45;
      font-weight: 600;
      animation: msgPop 0.25s ease-out;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--pink-primary);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.25);
    }

    .message.ai {
      align-self: flex-start;
      background: white;
      border: 2px solid #FFD1DC;
      color: var(--text-main);
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .chat-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-mic {
      background-color: #FF4785;
      border-radius: 50%;
      width: 52px;
      height: 52px;
      min-height: 52px;
      padding: 0;
      flex-shrink: 0;
      font-size: 1.4rem;
    }

    .btn-mic.recording {
      background-color: #EF4444;
      animation: micPulse 1s infinite alternate;
    }

    @keyframes micPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      100% { transform: scale(1.12); box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>🌸 AI Career Interview</h1>
    <button class="btn btn-secondary" onclick="resetApp()">✨ Start Over</button>
  </header>

  <!-- MAIN CONTAINER -->
  <div class="container">
    
    <!-- STEP 1: Enter Name -->
    <div id="step1" class="card">
      <h2 class="step-title">🎀 Step 1: Type Your Name</h2>
      <p class="step-desc">Welcome to your AI Career Interview! What is your name?</p>
      <div class="input-group">
        <input type="text" id="studentNameInput" placeholder="e.g. Alex" onkeypress="if(event.key==='Enter') goToStep2()" />
        <button class="btn" onclick="goToStep2()">Next &rarr;</button>
      </div>
    </div>

    <!-- STEP 2: Choose Job (11 Professions) -->
    <div id="step2" class="card hidden">
      <h2 class="step-title">🌟 Step 2: Choose Your Career</h2>
      <p class="step-desc">Who would you like to interview today?</p>
      <div class="jobs-grid" id="jobsGrid"></div>
      <div style="margin-top: 1.8rem; text-align: center;">
        <button class="btn" onclick="startInterview()">Start Interview 🎤 &rarr;</button>
      </div>
    </div>

    <!-- STEP 3: Chatroom & Talking Avatar -->
    <div id="step3" class="card hidden">
      <div class="chat-layout">
        <div class="avatar-panel">
          <div class="avatar-wrapper">
            <img id="avatarImg" class="avatar-img" src="" alt="Avatar" />
          </div>
          <h3 id="avatarTitle" style="font-family:'Fredoka'; font-size:1.3rem; margin-bottom: 0.5rem; color:var(--pink-primary);">Job Title</h3>
          <span id="statusBadge" class="status-badge">AI Idle</span>
        </div>

        <div class="chat-panel">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-controls">
            <button id="micBtn" class="btn btn-mic" onclick="toggleSTT()" title="Tap to Speak">🎤</button>
            <input type="text" id="userInput" placeholder="Type your question..." onkeypress="handleKeyPress(event)" />
            <button class="btn" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // =========================================================================
    // 1. GEMINI API KEY CONFIGURATION
    // Set your Gemini API Key here. No input is needed from students!
    // =========================================================================
    const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE";

    // =========================================================================
    // 2. VECTOR AVATARS GENERATOR (11 JOBS WITH OPEN & CLOSED MOUTH STATES)
    // Ensures 100% reliable lip-sync animation with zero broken external links!
    // =========================================================================
    function buildCuteSVG(jobKey, isOpenMouth) {
      const mouthShape = isOpenMouth 
        ? `<ellipse cx="100" cy="116" rx="10" ry="12" fill="#FF4785"/><ellipse cx="100" cy="120" rx="6" ry="5" fill="#FF80AB"/>` 
        : `<path d="M90,114 Q100,122 110,114" stroke="#4A3E4E" stroke-width="4" fill="none" stroke-linecap="round"/>`;

      // Base skin, eyes, pink cheeks
      const baseHead = `
        <circle cx="100" cy="100" r="90" fill="#FFF0F5" />
        <circle cx="100" cy="105" r="50" fill="#FFE0BD" />
        <!-- Pink Cheeks -->
        <circle cx="70" cy="112" r="8" fill="#FFB6C1" opacity="0.8"/>
        <circle cx="130" cy="112" r="8" fill="#FFB6C1" opacity="0.8"/>
        <!-- Eyes -->
        <circle cx="78" cy="98" r="6" fill="#4A3E4E"/>
        <circle cx="122" cy="98" r="6" fill="#4A3E4E"/>
        <circle cx="80" cy="96" r="2" fill="#FFFFFF"/>
        <circle cx="124" cy="96" r="2" fill="#FFFFFF"/>
        ${mouthShape}
      `;

      let accessory = "";
      if (jobKey === 'teacher') {
        accessory = `<rect x="65" y="90" width="26" height="16" rx="4" fill="none" stroke="#FF4785" stroke-width="3"/>
                     <rect x="109" y="90" width="26" height="16" rx="4" fill="none" stroke="#FF4785" stroke-width="3"/>
                     <line x1="91" y1="98" x2="109" y2="98" stroke="#FF4785" stroke-width="3"/>`;
      } else if (jobKey === 'chef') {
        accessory = `<path d="M60,65 Q100,20 140,65 Z" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
                     <rect x="65" y="60" width="70" height="12" fill="#FF4785" rx="3"/>`;
      } else if (jobKey === 'singer') {
        accessory = `<path d="M55,95 Q100,40 145,95" stroke="#C77DFF" stroke-width="6" fill="none"/>
                     <rect x="48" y="85" width="14" height="24" rx="6" fill="#FF6B9D"/>
                     <rect x="138" y="85" width="14" height="24" rx="6" fill="#FF6B9D"/>`;
      } else if (jobKey === 'actor') {
        accessory = `<path d="M70,48 L80,62 L98,62 L83,72 L88,88 L100,78 L112,88 L117,72 L132,62 L114,62 Z" fill="#FFD166"/>`;
      } else if (jobKey === 'doctor') {
        accessory = `<path d="M70,135 Q100,165 130,135" stroke="#4F46E5" stroke-width="5" fill="none"/>
                     <circle cx="100" cy="155" r="8" fill="#FFD166"/>`;
      } else if (jobKey === 'vet') {
        accessory = `<path d="M65,58 L80,35 L90,58 Z" fill="#FFB6C1"/>
                     <path d="M135,58 L120,35 L110,58 Z" fill="#FFB6C1"/>`;
      } else if (jobKey === 'scientist') {
        accessory = `<rect x="62" y="86" width="32" height="22" rx="8" fill="none" stroke="#10B981" stroke-width="4"/>
                     <rect x="106" y="86" width="32" height="22" rx="8" fill="none" stroke="#10B981" stroke-width="4"/>
                     <line x1="94" y1="97" x2="106" y2="97" stroke="#10B981" stroke-width="4"/>`;
      } else if (jobKey === 'fashion designer') {
        accessory = `<path d="M60,52 Q100,32 140,58 Z" fill="#FF6B9D"/>
                     <circle cx="135" cy="58" r="6" fill="#FFD166"/>`;
      } else if (jobKey === 'nurse') {
        accessory = `<path d="M70,55 L130,55 L125,38 L75,38 Z" fill="#FFFFFF" stroke="#FF4785" stroke-width="2"/>
                     <path d="M100,42 V50 M96,46 H104" stroke="#FF4785" stroke-width="3"/>`;
      } else if (jobKey === 'firefighter') {
        accessory = `<path d="M55,60 Q100,30 145,60 L150,68 H50 Z" fill="#EF4444"/>
                     <rect x="90" y="42" width="20" height="15" rx="3" fill="#FFD166"/>`;
      } else if (jobKey === 'pilot') {
        accessory = `<path d="M55,62 Q100,40 145,62 L140,70 H60 Z" fill="#1E3A8A"/>
                     <circle cx="100" cy="53" r="7" fill="#FFD166"/>`;
      }

      const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${baseHead}${accessory}</svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svgString);
    }

    // 11 Profession Objects
    const JOBS_LIST = [
      "Teacher", "Chef", "Singer", "Actor", "Doctor", 
      "Vet", "Scientist", "Fashion Designer", "Nurse", "Firefighter", "Pilot"
    ].map(name => {
      const id = name.toLowerCase();
      return {
        id: id,
        name: name,
        closedMouth: buildCuteSVG(id, false),
        openMouth: buildCuteSVG(id, true)
      };
    });

    let studentName = "";
    let selectedJob = null;
    let lipSyncTimer = null;
    let recognition = null;
    let isRecording = false;

    // --- Step 1 -> Step 2 ---
    function goToStep2() {
      const name = document.getElementById("studentNameInput").value.trim();
      if (!name) {
        alert("Please type your name first!");
        return;
      }
      studentName = name;
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
      renderJobGrid();
    }

    // Render the 11 Cute Job Cards
    function renderJobGrid() {
      const grid = document.getElementById("jobsGrid");
      grid.innerHTML = "";
      JOBS_LIST.forEach(job => {
        const card = document.createElement("div");
        card.className = `job-card ${selectedJob?.id === job.id ? 'selected' : ''}`;
        card.onclick = () => {
          selectedJob = job;
          document.querySelectorAll('.job-card').forEach(c => c.classList.remove('selected'));
          card.classList.add('selected');
        };
        card.innerHTML = `
          <img src="${job.closedMouth}" alt="${job.name}" />
          <h3>${job.name}</h3>
        `;
        grid.appendChild(card);
      });
    }

    // Start Chat Room
    function startInterview() {
      if (!selectedJob) {
        alert("Please pick a job to interview!");
        return;
      }
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");

      document.getElementById("avatarImg").src = selectedJob.closedMouth;
      document.getElementById("avatarTitle").innerText = selectedJob.name;

      const welcomeMsg = `Hello ${studentName}! I am a professional ${selectedJob.name}. What would you like to ask me today?`;
      addChatMessage("ai", welcomeMsg);
      speakText(welcomeMsg);
    }

    function resetApp() {
      window.speechSynthesis.cancel();
      stopLipSync();
      studentName = "";
      selectedJob = null;
      document.getElementById("chatMessages").innerHTML = "";
      document.getElementById("step3").classList.add("hidden");
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.remove("hidden");
    }

    // Chat UI Functions
    function addChatMessage(sender, text) {
      const box = document.getElementById("chatMessages");
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    // Send Message to Gemini API
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addChatMessage("user", text);
      updateStatus("AI Thinking...", "listening");

      try {
        const responseText = await callGeminiAPI(text);
        addChatMessage("ai", responseText);
        speakText(responseText);
      } catch (err) {
        console.error(err);
        // Built-in smart fallback if no API key is provided
        const fallbackText = getFallbackResponse(text);
        addChatMessage("ai", fallbackText);
        speakText(fallbackText);
      }
    }

    // Gemini API Direct Fetch Call
    async function callGeminiAPI(userQuery) {
      if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
        throw new Error("No API key set");
      }

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      const systemInstruction = `You are a friendly, professional ${selectedJob.name} being interviewed by ${studentName}, a Primary 5 student in Hong Kong (10-11 years old).
Rules:
1. Be extremely encouraging, cheerful, and inspiring!
2. Use simple English suitable for primary school ESL learners.
3. Keep answers short (2 short sentences max) so text-to-speech stays energetic and brief.`;

      const payload = {
        contents: [{ role: "user", parts: [{ text: userQuery }] }],
        systemInstruction: { parts: [{ text: systemInstruction }] }
      };

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || `That is a wonderful question! Being a ${selectedJob.name} is super exciting.`;
    }

    // Fallback response generator so the app works out-of-the-box before key configuration
    function getFallbackResponse(query) {
      const q = query.toLowerCase();
      if (q.includes("name") || q.includes("who")) {
        return `Hello ${studentName}! I am your friendly neighborhood ${selectedJob.name}.`;
      } else if (q.includes("like") || q.includes("favorite") || q.includes("fun")) {
        return `I love helping people and learning new things every day as a ${selectedJob.name}!`;
      } else if (q.includes("hard") || q.includes("difficult")) {
        return `Sometimes it takes practice, but working hard makes it super rewarding!`;
      } else {
        return `That is a great question! Being a ${selectedJob.name} is a fantastic job full of fun challenges.`;
      }
    }

    // --- Web Speech TTS & Talking Lip-Sync ---
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      stopLipSync();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;

      // Start animation immediately
      startLipSync();

      utterance.onend = () => stopLipSync();
      utterance.onerror = () => stopLipSync();

      window.speechSynthesis.speak(utterance);
    }

    function startLipSync() {
      if (!selectedJob) return;
      updateStatus("AI Speaking...", "speaking");
      
      let toggle = false;
      if (lipSyncTimer) clearInterval(lipSyncTimer);
      
      const avatarImg = document.getElementById("avatarImg");
      
      lipSyncTimer = setInterval(() => {
        avatarImg.src = toggle ? selectedJob.openMouth : selectedJob.closedMouth;
        toggle = !toggle;
      }, 170);
    }

    function stopLipSync() {
      if (lipSyncTimer) clearInterval(lipSyncTimer);
      if (selectedJob) {
        document.getElementById("avatarImg").src = selectedJob.closedMouth;
      }
      updateStatus("AI Idle", "idle");
    }

    function updateStatus(text, stateClass) {
      const badge = document.getElementById("statusBadge");
      badge.innerText = text;
      badge.className = `status-badge ${stateClass}`;
    }

    // --- Web Speech STT (Speech to Text) ---
    function toggleSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Please use Chrome or Safari.");
        return;
      }

      if (isRecording) {
        recognition.stop();
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById("micBtn").classList.add("recording");
        updateStatus("Listening...", "listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
        sendMessage();
      };

      recognition.onerror = () => stopSTT();
      recognition.onend = () => stopSTT();

      recognition.start();
    }

    function stopSTT() {
      isRecording = false;
      document.getElementById("micBtn").classList.remove("recording");
      updateStatus("AI Idle", "idle");
    }
  </script>
</body>
</html>
