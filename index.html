<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Interview - Hong Kong Primary 5</title>
  <!-- Google Fonts for cute, readable typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       CSS STYLES & THEME (Cute Pink Pastel Design)
       ========================================================================== */
    :root {
      --bg-pink: #FFF0F5;
      --light-pink: #FFD6E8;
      --hot-pink: #FF69B4;
      --dark-pink: #D81B60;
      --lavender: #E6E6FA;
      --light-blue: #DFF6FF;
      --soft-yellow: #FFF9D2;
      --mint-green: #E8FAEE;
      --white: #FFFFFF;
      --text-dark: #2D3748;
      --text-muted: #718096;
      --border-pink: #FFB6C1;
      --shadow-soft: 0 10px 25px rgba(255, 105, 180, 0.15);
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-pink);
      background-image: radial-gradient(#FFD6E8 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Header */
    .app-header {
      width: 100%;
      max-width: 1200px;
      background: linear-gradient(135deg, var(--hot-pink), #FF8DA1);
      color: var(--white);
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .app-header h1 {
      font-family: 'Fredoka', cursive;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }

    .free-badge {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
    }

    /* Main Layout Grid */
    .app-layout {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Panels */
    .panel {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      border: 3px solid var(--light-pink);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.25rem;
      color: var(--dark-pink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 2px dashed var(--light-pink);
      padding-bottom: 8px;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: 700;
      color: var(--dark-pink);
      font-size: 0.95rem;
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--light-pink);
      border-radius: var(--radius-md);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: var(--bg-pink);
    }

    .input-field:focus {
      border-color: var(--hot-pink);
      box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.2);
      background-color: var(--white);
    }

    /* Step 2: Career Selection Grid */
    .career-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .career-grid::-webkit-scrollbar {
      width: 6px;
    }

    .career-grid::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .career-card {
      background: var(--white);
      border: 2px solid var(--light-pink);
      border-radius: var(--radius-md);
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
      min-height: 70px;
    }

    .career-card:hover {
      transform: translateY(-3px);
      border-color: var(--hot-pink);
      background-color: var(--bg-pink);
    }

    .career-card.active {
      background-color: var(--light-pink);
      border-color: var(--hot-pink);
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.3);
      transform: scale(1.03);
    }

    .career-card .emoji {
      font-size: 1.8rem;
    }

    .career-card .title {
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-dark);
    }

    /* Avatar Card */
    .avatar-card {
      background: linear-gradient(180deg, var(--light-pink) 0%, var(--lavender) 100%);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--white);
      border: 4px solid var(--white);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .career-badge {
      margin-top: 10px;
      background: var(--hot-pink);
      color: var(--white);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
    }

    .status-indicator {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--white);
      color: var(--text-muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #CBD5E0;
    }

    .status-indicator.ready .status-dot { background-color: #48BB78; }
    .status-indicator.listening .status-dot { background-color: #E53E3E; animation: pulse 1s infinite; }
    .status-indicator.processing .status-dot { background-color: #ED8936; animation: pulse 1s infinite; }
    .status-indicator.speaking .status-dot { background-color: var(--hot-pink); animation: pulse 0.6s infinite; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Teacher Controls & Suggested Questions Panel */
    .teacher-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--hot-pink);
      width: 16px;
      height: 16px;
    }

    .suggested-questions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .suggested-questions-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .suggested-questions-grid::-webkit-scrollbar {
      width: 6px;
    }

    .suggested-questions-grid::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .question-btn {
      background-color: var(--light-blue);
      border: 1.5px solid #BEE3F8;
      color: #2B6CB0;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .question-btn:hover {
      background-color: #BEE3F8;
      border-color: #63B3ED;
      transform: translateX(3px);
    }

    .idea-btn {
      background: linear-gradient(135deg, #F6AD55, #ED8936);
      color: var(--white);
      border: none;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s, box-shadow 0.2s;
      min-height: 44px;
    }

    .idea-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(237, 137, 54, 0.3);
    }

    /* Right Panel: Chat Area */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 650px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-pink);
      border-radius: var(--radius-md);
      border: 2px solid var(--light-pink);
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: var(--light-pink);
      border-radius: 10px;
    }

    .message-bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.45;
      position: relative;
      animation: fadeIn 0.3s ease-in-out;
      word-break: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-bubble.user {
      align-self: flex-end;
      background-color: var(--hot-pink);
      color: var(--white);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 10px rgba(255, 105, 180, 0.25);
    }

    .message-bubble.ai {
      align-self: flex-start;
      background-color: var(--white);
      color: var(--text-dark);
      border: 2px solid var(--light-pink);
      border-bottom-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message-header {
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .message-timestamp {
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.7;
    }

    /* Chat Input Form Controls */
    .chat-input-area {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-controls-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mic-btn {
      background-color: #F0FFF4;
      border: 2px solid #C6F6D5;
      color: #2F855A;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .mic-btn:hover {
      background-color: #DCFCE7;
      transform: scale(1.05);
    }

    .mic-btn.listening {
      background-color: #FED7D7;
      border-color: #FEB2B2;
      color: #C53030;
      animation: pulse 1s infinite;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--hot-pink), var(--dark-pink));
      color: var(--white);
      border: none;
      padding: 0 20px;
      height: 48px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Typing Dots */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--white);
      border-radius: var(--radius-md);
      border: 2px solid var(--light-pink);
      align-self: flex-start;
      width: fit-content;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background-color: var(--hot-pink);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Responsive Styles */
    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }

      .chat-container {
        height: 500px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .app-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 14px 18px;
      }

      .app-header h1 {
        font-size: 1.4rem;
      }

      .panel {
        padding: 14px;
        border-radius: var(--radius-md);
      }

      .career-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        max-height: 180px;
      }

      .career-card .emoji {
        font-size: 1.5rem;
      }

      .career-card .title {
        font-size: 0.75rem;
      }

      .chat-container {
        height: 420px;
      }

      .message-bubble {
        max-width: 90%;
        font-size: 0.88rem;
      }

      .send-btn {
        padding: 0 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <h1><span>🌟</span> AI Career Interview <span>👩‍🏫</span></h1>
    <div class="free-badge">
      <span>⚡ Instant Access (No Key Needed)</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="app-layout">
    
    <!-- LEFT PANEL: Step 1 (Type name), Step 2 (Choose job), Suggestions -->
    <section class="panel" aria-label="Student Configuration Panel">
      
      <!-- STEP 1: Type name -->
      <div class="form-group">
        <div class="section-title">
          <span>Step 1: Type your name</span>
          <span>✏️</span>
        </div>
        <label for="studentNameInput">Your Name</label>
        <input type="text" id="studentNameInput" class="input-field" placeholder="Enter your name" value="Alex" aria-label="Student Name Input">
      </div>

      <!-- STEP 2: Choose job -->
      <div class="form-group">
        <div class="section-title">
          <span>Step 2: Choose the job</span>
          <span>💼</span>
        </div>
        <div class="career-grid" id="careerGrid" role="radiogroup" aria-label="Career Selection">
          <!-- Dynamically populated career cards -->
        </div>
      </div>

      <!-- Avatar & Status Card (Inline SVG guarantees 100% rendering success) -->
      <div class="avatar-card" aria-label="AI Interviewer Avatar">
        <div class="avatar-wrapper">
          <svg id="avatarSvg" viewBox="0 0 200 200" width="140" height="140" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="200" rx="40" fill="#FFD6E8"/>
            <circle cx="100" cy="100" r="70" fill="#FFFFFF" stroke="#FF69B4" stroke-width="6"/>
            <!-- Eyes -->
            <circle cx="75" cy="85" r="9" fill="#333333"/>
            <circle cx="125" cy="85" r="9" fill="#333333"/>
            <circle cx="78" cy="82" r="3" fill="#FFFFFF"/>
            <circle cx="128" cy="82" r="3" fill="#FFFFFF"/>
            <!-- Cheeks -->
            <ellipse cx="60" cy="110" rx="10" ry="6" fill="#FFB6C1" opacity="0.7"/>
            <ellipse cx="140" cy="110" rx="10" ry="6" fill="#FFB6C1" opacity="0.7"/>
            <!-- Mouth element dynamically updated during speech -->
            <path id="avatarMouth" d="M 85 115 Q 100 125 115 115" fill="none" stroke="#FF69B4" stroke-width="5" stroke-linecap="round"/>
            <!-- Crown / Star Decor -->
            <polygon points="100,28 108,46 92,46" fill="#FFD166"/>
          </svg>
        </div>
        <div id="careerBadge" class="career-badge">Teacher 👩‍🏫</div>
        <div id="statusIndicator" class="status-indicator ready" aria-live="polite">
          <span class="status-dot"></span>
          <span id="statusText">AI Status: Ready</span>
        </div>
      </div>

      <!-- Teacher Controls & Suggested Questions Panel -->
      <div class="form-group">
        <div class="teacher-control">
          <label class="checkbox-label">
            <input type="checkbox" id="toggleSuggestions" checked aria-label="Toggle Suggested Questions">
            Show Suggested Questions
          </label>
        </div>

        <div id="suggestedQuestionsContainer" class="suggested-questions-container">
          <button id="ideaBtn" class="idea-btn" type="button">
            <span>💡</span> Give Me a Question Idea
          </button>
          
          <div class="section-title" style="font-size: 1rem; border: none; padding: 0; margin-top: 4px;">
            <span>Suggested Questions</span>
          </div>
          
          <div id="suggestedQuestionsGrid" class="suggested-questions-grid">
            <!-- Dynamically populated suggested question buttons -->
          </div>
        </div>
      </div>

    </section>

    <!-- RIGHT PANEL: STEP 3 (Talk to the avatar) -->
    <section class="panel chat-container" aria-label="Chat and Interaction Area">
      <div class="section-title">
        <span>Step 3: Talk to the avatar</span>
        <span>💬</span>
      </div>

      <!-- Chat History -->
      <div id="chatMessages" class="chat-messages" aria-live="polite">
        <!-- Chat bubbles appended here dynamically -->
      </div>

      <!-- Input Controls -->
      <div class="chat-input-area">
        <div class="input-controls-row">
          <button id="micBtn" class="mic-btn" type="button" title="Tap to Speak" aria-label="Speech Recognition Button">
            🎙️
          </button>
          <input type="text" id="questionInput" class="input-field" placeholder="Type your question..." aria-label="Question Input Textbox">
          <button id="sendBtn" class="send-btn" type="button" aria-label="Send Question Button">
            <span>Send</span> 🚀
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript Code Section -->
  <script>
    /* ==========================================================================
       1. CAREER DATA (13 Careers)
       ========================================================================== */
    const CAREERS = [
      { id: "teacher", title: "Teacher", emoji: "👩‍🏫" },
      { id: "chef", title: "Chef", emoji: "👨‍🍳" },
      { id: "singer", title: "Singer", emoji: "🎤" },
      { id: "actor", title: "Actor", emoji: "🎬" },
      { id: "doctor", title: "Doctor", emoji: "👨‍⚕️" },
      { id: "vet", title: "Vet", emoji: "🐶" },
      { id: "scientist", title: "Scientist", emoji: "🔬" },
      { id: "fashion_designer", title: "Fashion Designer", emoji: "👗" },
      { id: "nurse", title: "Nurse", emoji: "👩‍⚕️" },
      { id: "firefighter", title: "Firefighter", emoji: "🚒" },
      { id: "astronaut", title: "Astronaut", emoji: "🚀" },
      { id: "pilot", title: "Pilot", emoji: "✈️" },
      { id: "youtuber", title: "YouTuber", emoji: "📹" }
    ];


    /* ==========================================================================
       2. SUGGESTED QUESTIONS DATA
       ================================
